name: Build and deploy JAR app to Azure Web App

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java version
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'microsoft'

      - name: Build with Maven
        run: |
          mvn -B clean package
          jar tf target/wordy-backend-0.0.1-SNAPSHOT.jar > jar-content.txt
          grep 'BOOT-INF/classes/com/wordy/wordy_backend/WordyBackendApplication.class' jar-content.txt
          mv target/wordy-backend-0.0.1-SNAPSHOT.jar target/app.jar

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: target/app.jar

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: 'production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: java-app

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'wordy-api-marvin'
          slot-name: 'Production'
          package: 'app.jar'
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
