spring.application.name=wordy-backend
server.port=8080

# URL de conexi\u00f3n a Azure SQL
spring.datasource.url=jdbc:sqlserver://wordy-db.database.windows.net:1433;database=WordyDB;encrypt=true;trustServerCertificate=false;hostNameInCertificate=*.database.windows.net;loginTimeout=30;

# Credenciales de Azure
spring.datasource.username=adminwordy
spring.datasource.password=Marvin2025\#Azure

# Configuraci\u00f3n del Driver
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Configuraci\u00f3n de JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.SQLServerDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true